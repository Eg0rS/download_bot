services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  bot:
    image: ${BOT_IMAGE:-media-downloader-bot:local}
    build:
      context: .
    restart: unless-stopped
    init: true
    stop_grace_period: 150s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      ADMIN_IDS: ${ADMIN_IDS:-}
      APP_ENV: production
      LOG_LEVEL: info
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      DB_DSN: file:/data/bot.db?cache=shared&mode=rwc
      TEMP_DIR: /tmp/media-downloader
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      DOWNLOADER_MAX_CONCURRENT: ${DOWNLOADER_MAX_CONCURRENT:-2}
      DOWNLOADER_TIMEOUT_MINUTES: ${DOWNLOADER_TIMEOUT_MINUTES:-10}
      WEBHOOK_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=128
    volumes:
      - bot_data:/data
      - ./config.yaml:/app/config.yaml:ro
    tmpfs:
      - /tmp/media-downloader:uid=1000,gid=1000,mode=0700,size=512m
    ports:
      - "127.0.0.1:8080:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD","wget","-q","--spider","http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  redis_data:
  bot_data:
